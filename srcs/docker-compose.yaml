services:
  nginx:
      container_name: nginx
      image: nginx
      build:
        context: requirements/nginx
      restart: unless-stopped
      env_file: .env
      ports:
          - "443:443"
      depends_on:
        - wordpress
      networks:
        - docker-network
      volumes:
          - ./requirements/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:rw
          - wordpress_vol:/var/www/wordpress
  mariadb:
    container_name: mariadb
    image: mariadb
    build:
      context: requirements/mariadb
    restart: unless-stopped
    env_file: .env
    networks:
      - docker-network
    volumes:
      - mariadb_vol:/var/lib/mysql
    secrets: 
      - db_user
      - db_password
      - db_root_password
  wordpress:
    container_name: wordpress
    image: wordpress
    build:
      context: requirements/wordpress
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mariadb
    networks:
      - docker-network
    volumes:
      - wordpress_vol:/var/www/wordpress
      - ./requirements/wordpress/conf/www.conf:/etc/php/8.2/fpm/pool.d/www.conf:rw
      - ./requirements/wordpress/tools/config_script.sh:/var/www/wordpress/config_script.sh:xrw
    secrets: 
      - db_user
      - db_password
      - db_2nd_user_password
      - db_2nd_user
      - db_admin_password
      - db_admin

networks:
  docker-network:
    driver: bridge 

volumes:
  mariadb_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/apeuget42/data/mariadb
  wordpress_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/apeuget42/data/wordpress

secrets:
  db_user:
    file: ../secrets/db_user.txt
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_2nd_user:
    file: ../secrets/db_2nd_user.txt
  db_2nd_user_password:
    file: ../secrets/db_2nd_user_password.txt
  db_admin:
    file: ../secrets/db_admin.txt
  db_admin_password:
    file: ../secrets/db_admin_password.txt
  # db_name:
  #   file: ../secrets/db_name.txt
